name: Daily Reels to Telegram

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1,4,7,11,15 * * *'

permissions:
  contents: write

concurrency:
  group: reelflow-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PUSH_TOKEN || github.token }}

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.deno/bin:$PATH"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install --upgrade yt-dlp
          "$HOME/.deno/bin/deno" --version
          yt-dlp --version

      - name: Diagnose YouTube downloader
        run: |
          yt-dlp --version
          "$HOME/.deno/bin/deno" --version
          yt-dlp --list-formats "https://www.youtube.com/watch?v=2qm2KLsd92Q" || true

      - name: Download, process and send at most one new video
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python app/runner.py

      - name: Save sent history
        run: |
          git config user.name "reelflow-bot"
          git config user.email "actions-bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update sent video history"
            git push
          fi
